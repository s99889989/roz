<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖母健康農莊公告</title>
    <style>
        :root {
            --main-red: #b32d2e;
            --text-grey: #333;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border: 1px solid #ddd;
            position: relative;
            text-align: center;
            padding-bottom: 250px; /* 為下方插畫預留空間 */
            overflow: hidden;
        }
        /* 上方標題區 */
        .header {
            margin-top: 40px;
        }
        .farm-name {
            font-size: 32px;
            font-weight: bold;
            color: var(--text-grey);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .sakura { color: #ffb7c5; font-size: 24px; }
        .main-title {
            font-size: 42px;
            color: var(--main-red);
            font-weight: 900;
            margin: 15px 0;
            letter-spacing: 2px;
        }
        /* 內文資訊區 */
        .content {
            padding: 0 40px;
            text-align: left;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-grey);
        }
        .date-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
        }
        .restaurant-section {
            margin-top: 20px;
        }
        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--main-red);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .highlight {
            color: var(--main-red);
            font-weight: bold;
        }
        .contact-section {
            margin-top: 25px;
        }
        .phone-link {
            text-decoration: none;
            color: inherit;
            display: block;
            font-weight: bold;
        }
        /* 下方插畫模擬區 (使用圖片或顏色塊模擬) */
        .footer-illustration {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 230px;
            background: linear-gradient(to bottom, transparent 0%, #a8d5ba 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 20px;
        }
        .kids-placeholder {
            font-size: 60px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="farm-name"><span class="sakura">🌸</span> 聖母健康農莊 <span class="sakura">🌸</span></div>
        <div class="main-title">春節休園公告</div>
    </div>

    <div class="content">
        <div class="date-box">
            <span>▣</span>
            <span>休園日期：2/14 (六) － 2/22 (日)</span>
        </div>

        <div class="restaurant-section">
            <div class="section-title">🍎 田園餐廳 ‧ 特別服務方案</div>
            <div style="margin-left: 30px;">
                休園期間，餐廳採<span class="highlight">預約制</span>開放。<br>
                <span class="highlight">定位條件：</span>團體訂位 <span class="highlight">40人以上 (午晚餐均可)</span>。
            </div>
        </div>

        <div class="contact-section">
            <div style="display: flex; gap: 10px; font-weight: bold;">
                <span>📞</span>
                <div>
                    預約專線<br>
                    <a href="tel:089381382" class="phone-link">089-381382 #889</a>
                    <a href="tel:0963816271" class="phone-link">或打 0963-816271</a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-illustration">
        <div class="kids-placeholder">🧑‍🤝‍🧑🎨🐾</div>
        <div style="color: #2e5a1c; font-weight: bold;">🧧 祝大家新春愉快 平安健康 🧧</div>
    </div>
</div>

</body>
</html>
