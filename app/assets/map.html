/div><div class="cell green">100%</div><div class="cell green">100%</div><div class="cell brown">75%</div><div class="cell brown">75%</div><div class="cell red">50%</div><div class="cell brown">75%</div><div class="cell brown">75%</div><div class="cell brown">75%</div><div class="cell green">100%</div></div></div></div></div>

<script>
    // 預設地點資料
    let schedule = [
        { name: "教會", travel: 0, stay: 30 },
        { name: "醫院", travel: 6, stay: 15 },
        { name: "張豪傑", travel: 4, stay: 5 },
        { name: "陳松春", travel: 13, stay: 30 },
        { name: "施又維", travel: 10, stay: 30 },
        { name: "林時君", travel: 1, stay: 30 },
        { name: "駱雲華", travel: 1, stay: 30 },
        { name: "吳婉君", travel: 5, stay: 30 },
        { name: "教會", travel: 7, stay: 0 },
    ];

    function calculate() {
        const startTimeVal = document.getElementById('startTime').value;
        const [h, m] = startTimeVal.split(':').map(Number);
        let current = new Date();
        current.setHours(h, m, 0);

        const tbody = document.getElementById('schedule-body');
        const emptyState = document.getElementById('empty-state');

        if (schedule.length === 0) {
            tbody.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        } else {
            emptyState.classList.add('hidden');
        }

        tbody.innerHTML = '';

        schedule.forEach((item, i) => {
            // 時間累加：從第二站開始計算 (抵達時間 = 上一站離開時間 + 這一站路程)
            if (i > 0) {
                const prevStay = schedule[i-1].stay || 0;
                const thisTravel = item.travel || 0;
                current.setMinutes(current.getMinutes() + prevStay + thisTravel);
            }

            const timeStr = current.getHours().toString().padStart(2, '0') + ":" +
                current.getMinutes().toString().padStart(2, '0');

            const row = document.createElement('tr');
            row.className = "border-b border-slate-100 hover:bg-slate-50 transition-colors";
            row.innerHTML = `
                    <td class="py-4 text-center font-bold text-xl text-blue-600">
                        ${timeStr}
                    </td>
                    <td class="px-4 py-4">
                        <input type="text" value="${item.name}" oninput="updateData(${i}, 'name', this.value)" class="input-text font-bold text-slate-800 text-lg no-print">
                        <span class="hidden print:inline font-bold text-lg">${item.name}</span>
                    </td>
                    <td class="py-4 text-center">
                        ${i === 0 ? '<span class="text-slate-300">-</span>' : `
                            <input type="number" value="${item.travel}" oninput="updateData(${i}, 'travel', this.value)" class="input-num no-print">
                            <span class="hidden print:inline">${item.travel} 分</span>
                        `}
                    </td>
                    <td class="py-4 text-center">
                        <input type="number" value="${item.stay}" oninput="updateData(${i}, 'stay', this.value)" class="input-num no-print">
                        <span class="hidden print:inline">${item.stay} 分</span>
                    </td>
                    <td class="py-4 text-center no-print">
                        <button onclick="removeLocation(${i})" class="text-red-400 hover:text-red-600">🗑️</button>
                    </td>
                `;
            tbody.appendChild(row);
        });
    }

    // 更新資料並重新計算
    function updateData(index, field, value) {
        if (field === 'name') {
            schedule[index].name = value;
        } else {
            schedule[index][field] = parseInt(value) || 0;
            calculate(); // 分鐘數改變才需要重新推算時間
        }
    }

    // 新增地點
    function addLocation() {
        schedule.push({ name: "新地點", travel: 10, stay: 30 });
        calculate();
    }

    // 移除地點
    function removeLocation(index) {
        if (confirm('確定要刪除此行程點嗎？')) {
            schedule.splice(index, 1);
            calculate();
        }
    }

    // 初始執行
    calculate();
</script>
